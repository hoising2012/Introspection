<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.background{
  pointer-events: none;
  display: flex;
  justify-content: center; /* Horizontal alignment */
  align-items: center;
  margin-top: 200px;	
}
.feather {
  display: inline-block;
  position: absolute;
  width: 150px;
  height: 180px;
  background: url('feather.jpg') no-repeat center/contain;
  animation: fall 6s linear infinite, sway 3s ease-in-out infinite alternate;
}

@keyframes fall {
  0% {
    top: -10vh;
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  90% {
    opacity: 1;
  }
  100% {
    top: 110vh;
    opacity: 0;
  }
}

@keyframes sway {
  0% {
    transform: translateX(-50px) rotate(-15deg);
  }
  100% {
    transform: translateX(50px) rotate(15deg);
  }
}
</style>
</head>
<body>
<h2>Feather falling</h2>
<div class="background">
<div class="feather"></div>
</div>
</body>
</html>
